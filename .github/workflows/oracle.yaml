# The live engines behind tests/testthat/fixtures/engines.rds (design 12,
# tools/oracle/README.md). The package's tests replay DuckDB's, arrow's and
# nanoarrow's answers and load none of them; this job records the answers
# afresh from the engines and fails if any differs from the committed
# fixture, so a new DuckDB that changes a type rule, or a test that asks
# something new, is seen. It also runs zuint inside dplyr, tibble and
# data.table (tools/oracle/test-interop.R).
#
# Full profile only (a dispatch, or a pull request labelled `full-ci`): the
# per-push replay already fails when zuint's output stops matching what was
# recorded. Run it on demand with `gh workflow run oracle.yaml --ref <branch>`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

name: oracle

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ci.md: a documentation-only pull request skips the job below.
  changes:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:oracle'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: oracle

  oracle:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    name: engines against the fixture
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::duckdb
            any::DBI
            any::nanoarrow
            any::arrow
            any::dplyr
            any::tibble
            any::data.table
            any::pkgload
            local::.

      - name: Record the engines' answers afresh
        env:
          ZUINT_ORACLE_OUT: ${{ runner.temp }}/engines.rds
        run: tools/oracle/record

      - name: Compare with the committed fixture
        run: Rscript tools/oracle/compare.R tests/testthat/fixtures/engines.rds "$RUNNER_TEMP/engines.rds"

      - name: zuint in dplyr, tibble and data.table
        run: Rscript -e 'pkgload::load_all(); testthat::test_file("tools/oracle/test-interop.R", stop_on_failure = TRUE)'
