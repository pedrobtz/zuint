on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1
    permissions:
      contents: write
    with:
      # main takes changes only through pull requests, so the badge commit
      # goes to gh-pages, which the pkgdown deploy also writes to.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
