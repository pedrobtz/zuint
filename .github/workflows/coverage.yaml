on:
  # No `push:`: a pull request already checks its merge with main. No
  # `schedule:` either, since the repository went private (CLAUDE.md,
  # Continuous integration); run main on demand with workflow_dispatch.
  workflow_dispatch:
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@72ecdaf3536ed6b5984ed12815e168ee16ab8aa4 # v1.46.1
    permissions:
      contents: write
    with:
      # main takes changes only through pull requests, so the badge commit
      # goes to gh-pages, which the pkgdown deploy also writes to.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
      # 96.8% on 2026-11-26 (#132): a little under, so a change that drops
      # coverage goes red
      fail-under: 95
