on:
  # No `push:`: a pull request already checks its merge with main. No
  # `schedule:` either, since the repository went private (CLAUDE.md,
  # Continuous integration); run main on demand with workflow_dispatch.
  workflow_dispatch:
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Full profile only: CRAN's NOSUGGESTS and NOLD flavors. zuint has
      # Suggests, and its parsing and double conversion must not lean on
      # 80-bit intermediates.
      nosuggests: true
      nold: true
      # No container in the quick profile: the containers are R-devel, which
      # builds arrow and duckdb from source. The full profile runs all three.
      quick-containers: '[]'
      # duckdb from r-universe's R-devel binaries when it has them, and 90
      # minutes, not 45, for a cold cache that builds duckdb from source
      # (PR #89's first full run timed out building it).
      pre-install: Rscript tools/ci-binaries.R
      timeout-minutes: 90
      # Every leg is 64-bit gcc or clang, so every leg must build on
      # __int128; test-storage.R checks.
      env: |
        ZUINT_EXPECT_INT128=true
      # Quick on pull requests; full on a manual dispatch and on a pull
      # request labelled `full-ci`.
      profile: auto

  # zufast/wide.h's portable fallback, forced: src/Makevars passes
  # ZUINT_CPPFLAGS to the compiler, and test-storage.R checks that the build
  # really took the fallback. One Ubuntu leg, in both profiles.
  no-int128:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      runners: '[{"os": "ubuntu-latest", "r": "release"}]'
      containers: '[]'
      quick-containers: '[]'
      env: |
        ZUINT_CPPFLAGS=-DZUF_NO_INT128
        ZUINT_EXPECT_INT128=false
      profile: auto
