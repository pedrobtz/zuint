# The C layer under UBSan, ASan, valgrind, LTO, gctorture and rchk, plus
# GCC's analyzer and CRAN's special checks. Quick on pull requests; full on
# a manual dispatch and on a pull request labelled `full-ci`. `profile` goes to the four workflows it changes: quick skips the
# asan containers, valgrind and cran-special, and runs gctorture at step 500
# instead of 20.
on:
  # No `push:`: a pull request already checks its merge with main. No
  # `schedule:` either, since the repository went private (CLAUDE.md,
  # Continuous integration); run main on demand with workflow_dispatch.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      # R-devel has no binaries, so its dependencies build from source; pull
      # requests use R-release, the full profile CRAN's R-devel.
      r-version: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'release' || 'devel' }}
      profile: auto

  # zufast's portable fallback (ZUF_NO_INT128) under UBSan and ASan, as
  # R-CMD-check.yaml's no-int128 job builds it: the fallback paths of
  # zu_arith.c and zu_reduce.c ran under no sanitizer before (#134). Full
  # profile only: a manual dispatch and a pull request labelled `full-ci`.
  sanitizers-no-int128:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      r-version: devel
      profile: auto
      env: |
        ZUINT_CPPFLAGS=-DZUF_NO_INT128
        ZUINT_EXPECT_INT128=false

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: auto

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      profile: auto
      # Step 20 took about 140 minutes with the fixed-point tests; the review
      # tests of #143 put test-decimal.R alone at 84 minutes, and 180 cancelled
      # the run in test-fixed.R (2026-11-26). 330 stays under GitHub's 360-minute
      # job limit. Step stays at 20: it caught the unprotected pair in
      # zu_fixed_r.c that rchk missed.
      timeout-minutes: 330

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      # The rchk image ignores Remotes:; drop this once zufast 0.1.1 is on
      # CRAN.
      github-packages: |
        pedrobtz/zufast

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: auto

  # src/vendor/arrow/abi.h is the pinned upstream file: tools/verify-vendor
  # re-downloads it and compares checksums, and a pull request that changes
  # the vendor tree must change PROVENANCE too.
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      verify: tools/verify-vendor
      must-update: |
        src/vendor/PROVENANCE
