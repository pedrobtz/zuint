# Fails each allocation tools/alloc-exercise.R makes after zuint is loaded,
# one per run (#91): native memory held across an R allocation that can
# longjmp, and a failed malloc in the Arrow export. The sweep restarts R
# once per allocation, so it runs on demand only, like the rest of zuint's
# full set while the repository has no schedule (CLAUDE.md):
# `gh workflow run alloc-failure.yaml --ref <branch>`.
#
# expect-pattern: an injected failure must surface as zuint's own
# "zuint: out of memory" error (from the Arrow kernels, a classed
# zuint_arrow_error whose message zu_arrow_try() strips to "out of memory"),
# or as R's or bash's allocation error, matched by its wording.
# target-pattern counts the failures that reached zuint's C. The first full
# sweep on main (2026-11-26, run 45877736225) had 22, all in the Arrow
# export; min-target-hits sits a little under, so a sweep that stops
# reaching zuint goes red.
on:
  workflow_dispatch:

name: alloc-failure

permissions:
  contents: read

jobs:
  alloc-failure:
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e 'suppressPackageStartupMessages(library(zuint))'
      max-allocations: 12000
      expect-pattern: "zuint: out of memory|zuint_[a-z]+_error/zuint_error/error/condition: out of memory|cannot allocate (vector|memory block|[0-9]+ bytes)|[Cc]ould not allocate|memory exhausted|out of virtual memory|cannot open file '[^']*\\.rdb': Cannot allocate memory"
      target-pattern: "alloc-exercise: (zuint_[a-z]+_error/zuint_error/error/condition: |.*zuint: )out of memory"
      min-target-hits: 18
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|regexpr|gregexpr|strsplit|gzfile)\\("
      timeout-minutes: 150
